# One-time setup per clone:  pre-commit install
# (installs both the pre-commit and commit-msg hooks listed below)
# Language linters/formatters are added with the CI pipeline (Phase A).
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files

  # Blocks commits containing secrets (keys, tokens, passwords)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Commit messages must follow Conventional Commits: <type>(<scope>): <summary>
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, ci, infra, deploy, build, docs, chore, refactor, test, style, perf]
